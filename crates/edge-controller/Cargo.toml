[package]
name = "edge-controller"
description = "Rhizo Edge control plane: MQTT ingestion, irrigation control, edge REST API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "edge_controller"
path = "src/lib.rs"

[[bin]]
name = "edge-controller"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
figment = { workspace = true }
prometheus = { workspace = true }
rhizo-domain = { path = "../domain" }
rhizo-cloud-client = { path = "../cloud-client" }
rhizo-mqtt-contract = { path = "../mqtt-contract" }
rhizo-policy = { path = "../policy" }
rhizo-storage = { path = "../storage" }
rhizo-telemetry = { path = "../telemetry" }
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
device-simulator = { path = "../device-simulator" }
rhizo-testkit = { path = "../testkit" }
tempfile = "3.27.0"
tower = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }

[lints]
workspace = true
