# Rhizo Edge — Mosquitto broker configuration.
#
# Authentication is on from the first commit (ADR-011 §Secrets, ADR-012).
# Retrofitting it later means a period during which it is absent, and that
# period always turns out to be the one where a device got provisioned.
#
# What this file deliberately does NOT do, in V1:
#
#   - no TLS. The V1 threat model is a trusted home LAN with one operator
#     (ADR-011). TLS is an M13 deliverable, and is the first thing to add for
#     any deployment that is not a single trusted network.
#   - no per-device certificates. Post-V1; the `device_id`-as-username
#     structure maps onto a certificate CN, so the ACL model below survives
#     that change unaltered (ADR-012).

# ------------------------------------------------------------------ listener
listener 1883 0.0.0.0
protocol mqtt

# ------------------------------------------------------------ authentication
# The single most important line in this file. Without it every ACL below is
# decoration: an anonymous client is not `%u` anything, and pattern rules do
# not constrain it.
allow_anonymous false

password_file /mosquitto/config/passwd
acl_file      /mosquitto/config/aclfile

# ------------------------------------------------------------------ sessions
# Sessions survive a broker restart so a QoS 1 message queued for a device that
# is asleep is still there when it wakes (ADR-002).
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------------- logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# A message is only useful if somebody can act on it, and 60 s of latency
# either way is irrelevant for a plant.
max_keepalive 300
