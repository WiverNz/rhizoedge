name: rhizo-edge

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    networks: [rhizo]
    env_file:
      - path: ../.env
        required: false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_pub -h localhost -p 1883
          -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}"
          -t rhizo/v1/health/broker -m ok -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s

  edge-controller:
    build:
      context: ..
      dockerfile: deploy/edge-controller.Dockerfile
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      cloud-api:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      RHIZO_EDGE__MQTT__BROKER_URL: mqtt://mosquitto:1883
      RHIZO_EDGE__STORAGE__PATH: /var/lib/rhizo/edge.sqlite
      RHIZO_EDGE__CLOUD__ENABLED: "true"
      RHIZO_EDGE__CLOUD__BASE_URL: http://cloud-api:8081
      RHIZO_EDGE__API__BIND: 0.0.0.0:8080
      RHIZO_EDGE__TIME_SCALE: ${RHIZO_TIME_SCALE:-1}
    volumes:
      - edge-data:/var/lib/rhizo
    ports:
      - "8080:8080"
    networks: [rhizo]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    stop_grace_period: 15s

  device-simulator:
    build:
      context: ..
      dockerfile: deploy/device-simulator.Dockerfile
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      edge-controller:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      RHIZO_TIME_SCALE: ${RHIZO_TIME_SCALE:-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec /usr/local/bin/device-simulator
        --device-id "sim-$${HOSTNAME}"
        --username rhizo-edge
        --password "$${RHIZO_EDGE__MQTT__PASSWORD}"
        --broker mqtt://mosquitto:1883
        --telemetry-interval 300
        --time-scale "$${RHIZO_TIME_SCALE:-1}"
        --state-file "/var/lib/rhizo/sim-$${HOSTNAME}.state.json"
        --log-format json
    volumes:
      - device-simulator-state:/var/lib/rhizo
    networks: [rhizo]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    stop_grace_period: 15s

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rhizo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhizo}
      POSTGRES_DB: ${POSTGRES_DB:-rhizo}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [rhizo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  cloud-api:
    build:
      context: ..
      dockerfile: deploy/cloud-api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RHIZO_CLOUD__DATABASE_URL: postgres://${POSTGRES_USER:-rhizo}:${POSTGRES_PASSWORD:-rhizo}@postgres:5432/${POSTGRES_DB:-rhizo}
      RHIZO_CLOUD__BIND: 0.0.0.0:8081
    ports:
      - "8081:8081"
    networks: [rhizo]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 3s
    stop_grace_period: 15s

networks:
  rhizo:
    driver: bridge

volumes:
  mosquitto-data:
  edge-data:
  device-simulator-state:
  postgres-data:
