# Rhizo Edge — the gate.
#
# Runs the five commands from PRD 000's acceptance criteria on every push and
# every pull request. A gate that runs only on a developer's machine is a gate
# that eventually stops running.
#
# This workflow reflects the repository as it is today, not as it will be. Jobs
# for the milestones still to come are listed at the bottom with the issue that
# adds them; a job referring to a crate that does not exist yet would fail for a
# reason that has nothing to do with the change being tested.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds are throwaway; incremental artefacts only make the cache larger.
  CARGO_INCREMENTAL: 0
  # A global `RUSTFLAGS: -D warnings` is deliberately NOT set: it applies to
  # dependencies as well, so a warning in someone else's crate would fail this
  # repository's build for a reason nobody here can fix. The clippy step below
  # passes `-D warnings` explicitly, which applies to workspace members only —
  # and clippy runs the rustc lints too, so the workspace lint table
  # (`missing_docs`, `unwrap_used`, …) is still enforced as errors.

jobs:
  # The documentation validator first, and on its own. It is dependency-free,
  # needs no network and no registry access, and takes seconds — so a broken
  # cross-reference is reported before anyone waits on a compile.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action and no cache: `rust-toolchain.toml` pins the
      # version, and the runner's preinstalled rustup honours it.
      - name: Validate planning artefacts
        run: cargo run -p rhizo-docscheck

  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs exactly what rust-toolchain.toml pins. The version lives in
      # that file and nowhere else, so a bump is one deliberate edit rather
      # than a hunt through the CI config.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      # Keyed on the lockfile and the toolchain version together: a stale
      # cache after a toolchain bump produces failures that look like code
      # problems and are not.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-

      # First, because it is the cheapest check and a formatting failure makes
      # every other diff in the run noisy.
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Verify SQLx offline query metadata
        run: |
          cargo install sqlx-cli --version 0.9.0 --no-default-features --features sqlite --locked
          mkdir -p data
          export DATABASE_URL="sqlite://$PWD/data/sqlx-ci.sqlite"
          cargo sqlx database create
          cargo sqlx migrate run --source migrations/edge
          cargo sqlx prepare --workspace --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Includes the fixture-drift check (M2-011): it captures what the
      # simulator really publishes and fails if the corpus no longer describes
      # it. Implemented as a Rust test rather than a script so it needs no
      # second toolchain here and cannot drift from the code it checks.
      - name: cargo test
        run: cargo test --workspace --all-features

      - name: Install bare-metal verification target
        run: rustup target add thumbv7em-none-eabi

      - name: no_std shared crates
        run: |
          cargo build -p rhizo-mqtt-contract --no-default-features --target thumbv7em-none-eabi
          cargo build -p rhizo-policy --no-default-features --target thumbv7em-none-eabi

  # Broker-backed conformance. The properties these tests check — retention,
  # the will, redelivery, ACL isolation — are *broker* behaviour, so testing
  # them against a mock would be testing a model of MQTT (PRD 020 §Problem).
  #
  # `RHIZO_REQUIRE_BROKER=1` turns the suite's local-development skip into a
  # failure: on a developer's machine a missing broker prints a loud skip so a
  # fresh clone is green, but a CI run that silently skipped its own subject
  # would be a gate that proves nothing.
  broker:
    name: integration (broker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: >-
            ${{ runner.os }}-broker-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-broker-${{ hashFiles('rust-toolchain.toml') }}-

      # Throwaway credentials for a throwaway broker on a throwaway runner.
      # `.env` is gitignored, so CI generates one exactly as first-run setup
      # tells a developer to — which also keeps that path exercised.
      #
      # Through the script, not a list of keys spelled out here. This step used
      # to name `RHIZO_DEVICE_PLANT_NODE_01_PASSWORD` and `…_02_…` literally,
      # and adding a third device to `DEVICE_IDS` broke it: the generator
      # refuses a placeholder, correctly, and the job failed before a single
      # test ran. `gen-dev-env.sh` reads `DEVICE_IDS` and fills whatever it
      # finds, so the two cannot drift again.
      - name: Generate credentials and start Mosquitto
        run: |
          set -euo pipefail
          ./scripts/gen-dev-env.sh
          ./scripts/gen-mosquitto-passwd.sh
          docker compose -f deploy/docker-compose.yml up -d --wait mosquitto

      - name: Broker-backed tests
        env:
          RHIZO_REQUIRE_BROKER: "1"
        run: |
          cargo test -p device-simulator --test integration
          cargo test -p device-simulator --test safety_007
          cargo test -p edge-controller --test integration -- --test-threads=1

      - name: Broker logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs mosquitto

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no `.env`. The file is gitignored, so this asserts what a
      # fresh clone can do — the property M0's exit criteria are actually
      # about.
      - name: Validate the Compose topology
        run: docker compose -f deploy/docker-compose.yml config

      # A shell script committed without its executable bit is a job that dies
      # with `Permission denied` and exit 126 before it runs anything, and the
      # bit is easy to lose: a file created on Windows has none to preserve.
      # The mode lives in the index, so this reads it from there rather than
      # from the working tree, and names the fix.
      - name: Every script is executable
        run: |
          set -euo pipefail
          not_executable="$(git ls-files -s scripts/ |
            awk '$1 != "100755" { print $4 }')"
          if [ -n "$not_executable" ]; then
            echo "these scripts are committed without the executable bit:" >&2
            echo "$not_executable" >&2
            echo >&2
            echo "fix with:  git update-index --chmod=+x <path>" >&2
            exit 1
          fi
          echo "all $(git ls-files scripts/ | wc -l) scripts are executable"

  # The firmware application logic, on the host toolchain.
  #
  # Separate from `rust` because `firmware/node-app` is its own workspace
  # (ADR-001 excludes `firmware/` from the root), so `cargo test --workspace`
  # in the root does not reach it. It is fast -- no ESP-IDF, no cross build and
  # no nightly -- so it gates merges alongside the host tests rather than
  # waiting behind the image build below.
  #
  # This is where the structural checks live: board isolation, the single
  # actuation path, and the simulator/firmware conformance suite (M9-014).
  firmware-app:
    name: firmware app (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        working-directory: firmware/node-app
        run: rustup show active-toolchain

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            firmware/node-app/target
          key: >-
            ${{ runner.os }}-fwapp-${{ hashFiles('firmware/node-app/rust-toolchain.toml') }}-${{ hashFiles('firmware/node-app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fwapp-${{ hashFiles('firmware/node-app/rust-toolchain.toml') }}-

      - name: cargo fmt
        working-directory: firmware/node-app
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: firmware/node-app
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: firmware/node-app
        run: cargo test --all-features

  # The ESP32-C3 image itself (M9-002).
  #
  # Separate and slow: `esp-idf-sys` clones ESP-IDF and builds its C components,
  # which dominates a cold run. It is cached aggressively and triggered only by
  # changes that can break it -- the firmware itself, or either shared crate,
  # because a contract edit that breaks embedded compatibility is exactly what
  # this job exists to catch (ADR-008).
  #
  # **A matrix over one board profile.** The point of ADR-007's board layer is
  # that a second ESP32-C3 board costs a profile and not a refactor, and a job
  # that hardcoded `--features board-devkitm1` would quietly make the second
  # profile someone else's problem. Adding `board-xiao-esp32c3` is one line
  # here, and the ESP-IDF cache is shared across legs so the marginal cost of a
  # leg is a compile.
  firmware-image:
    name: firmware image (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - board-devkitm1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether anything that can break the image changed
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          if ! git diff --name-only "$range" > /tmp/changed 2>/dev/null; then
            echo "cannot diff $range; building to be safe"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(firmware/|crates/mqtt-contract/|crates/policy/|[.]github/workflows/ci[.]yml)' /tmp/changed; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # `libudev-dev` is what `espflash` needs; the rest is what `esp-idf-sys`
      # bootstraps ESP-IDF with. Listed here rather than assumed, because
      # M9-001 established that espup provides none of it.
      - name: Install ESP-IDF prerequisites
        if: steps.changed.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
            python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libudev-dev

      # The heavy half: ESP-IDF itself, its toolchain, and the LLVM whose
      # `libclang` `esp-idf-sys`'s bindgen needs. Keyed on the pinned ESP-IDF
      # version and the firmware toolchain, both of which live in files.
      - name: Cache ESP-IDF and the ESP toolchain
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.rustup/toolchains/esp
            ~/.embuild
            firmware/esp32-node/.embuild
          key: >-
            ${{ runner.os }}-espidf-${{ hashFiles('firmware/esp32-node/.cargo/config.toml') }}-${{ hashFiles('firmware/esp32-node/rust-toolchain.toml') }}

      - name: Cache cargo registry and target
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            firmware/esp32-node/target
          key: >-
            ${{ runner.os }}-fwimage-${{ matrix.profile }}-${{ hashFiles('firmware/esp32-node/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fwimage-${{ matrix.profile }}-

      # `rust-toolchain.toml` pins a dated nightly with `rust-src`, because
      # `riscv32imc-esp-espidf` is a tier-3 target with no distributed `std`
      # and must be built with `-Z build-std` (M9-001).
      - name: Install the pinned firmware toolchain
        if: steps.changed.outputs.run == 'true'
        working-directory: firmware/esp32-node
        run: rustup show active-toolchain

      # `--targets all --std` rather than `--targets esp32c3`: a RISC-V-only
      # install writes an *empty* export script and installs no LLVM, and
      # `esp-idf-sys`'s bindgen then fails with "Unable to find libclang".
      # M9-001 found this by hitting it; the comment is the finding.
      - name: Install ldproxy and the ESP toolchain
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          cargo install ldproxy --locked
          cargo install espup --locked
          espup install --targets all --std
          . "$HOME/export-esp.sh"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          dirname "$LIBCLANG_PATH" >> "$GITHUB_PATH"

      - name: Build the image
        if: steps.changed.outputs.run == 'true'
        working-directory: firmware/esp32-node
        run: cargo build --release --no-default-features --features ${{ matrix.profile }}

      - name: cargo clippy
        if: steps.changed.outputs.run == 'true'
        working-directory: firmware/esp32-node
        run: >-
          cargo clippy --release --all-targets
          --no-default-features --features ${{ matrix.profile }} -- -D warnings

      # Zero or two board profiles must fail loudly and say why. Asserted on
      # the *message*, not on the exit status: a build that failed for an
      # unrelated reason would otherwise look like the guard working
      # (F-090-46).
      - name: Exactly one board profile
        if: steps.changed.outputs.run == 'true'
        working-directory: firmware/esp32-node
        run: |
          set -euo pipefail
          if cargo build --release --no-default-features 2>/tmp/none.txt; then
            echo "building with no board profile succeeded; the guard is gone" >&2
            exit 1
          fi
          grep -q "no board profile is selected" /tmp/none.txt
          grep -q "board-devkitm1" /tmp/none.txt

          if cargo build --release --features board-devkitm1,board-xiao-esp32c3 2>/tmp/two.txt; then
            echo "building with two board profiles succeeded; the guard is gone" >&2
            exit 1
          fi
          grep -q "exactly one board profile must be selected" /tmp/two.txt
          echo "both guards fire with a message naming the profiles"

  # ---------------------------------------------------------------------------
  # Jobs added by later milestones. Listed so their absence is visible rather
  # than merely unnoticed:
  #
  #   no_std contract build    M1-011  (in `rust`, above)
  #   firmware app             M9-002  (in `firmware-app`, above)
  #   firmware image           M9-002  (in `firmware-image`, above)
  #   UI                       M12
  #   release                  M13
