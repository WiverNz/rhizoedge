name: End-to-end

on:
  push:
    paths:
      - "crates/**"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "crates/**"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Fifty minutes for build **and** suite, from measurement rather than guess.
    #
    # Fifteen was set when this job had never once reached the scenarios, so
    # nothing about it had been measured. Two runs since have measured it: a
    # cold topology build takes about 14 minutes, and the suite is far from
    # uniform — the median scenario is 3 seconds and the slowest are 30 to 70,
    # because they drive hours of virtual time through a real simulator.
    #
    # Measured: 648 s for all 41 scenarios on a fast developer machine, and a
    # runner is roughly 1.5-2x slower again. Build 14 + suite 30 + teardown is
    # about 46, so 50 leaves the slack that stops a marginally slow run from
    # failing for no reason anybody can act on.
    #
    # The step below carries its own budget, so a hung *suite* and a slow
    # *build* fail differently and legibly. That separation is the property
    # worth having; this number is only the outer bound.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Enable Docker layer cache
        uses: docker/setup-buildx-action@v3

      # Every `change-me-*` placeholder, not just the edge's. `.env.example`
      # carries one per device in `DEVICE_IDS`, and `gen-mosquitto-passwd.sh`
      # refuses a placeholder by design — so filling only `MQTT_PASSWORD` here
      # failed the job before a single image was built. The script is the same
      # one a developer runs on a fresh clone, so the two cannot drift.
      - name: Generate throwaway credentials
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/gen-dev-env.sh
          ./scripts/gen-mosquitto-passwd.sh

      # `COMPOSE_PROFILES` so the scenario runner is in the bake set. It sits
      # behind the `runner` profile — `up` must not start it — and Compose
      # derives bake targets from the services it would start, so without this
      # the runner is the one image built *outside* the layer cache, by
      # `run-scenarios.sh`, on every run.
      - name: Build full topology with cached layers
        uses: docker/bake-action@v6
        env:
          COMPOSE_PROFILES: runner
        with:
          files: |
            deploy/docker-compose.yml
            deploy/docker-compose.test.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # One command, and no retry on failure. PRD 080 is explicit that a flaky
      # scenario is quarantined and fixed, never retried to green: a safety test
      # that is retried until it passes is a safety test that does not work.
      #
      # The script brings the topology up, waits on its health gates, runs the
      # runner as a one-shot container, and collects diagnostics on failure. It
      # is not `up --abort-on-container-exit`, because a third of these
      # scenarios stop containers on purpose and that flag would read the first
      # such stop as a reason to end the run — see the script's own header.
      - name: Run complete scenario suite once
        id: suite
        # Twenty-five minutes, measured rather than extrapolated.
        #
        # An earlier ten was sized from the first fourteen scenarios, which are
        # the fast ones — a median of 3 seconds each. That sample was not
        # representative: `scenario_offline_budget` takes 73 seconds on a
        # runner, `scenario_long_isolation` 50, and `scenario_history_gap`
        # several minutes because it must fill a 256-entry buffer at the
        # telemetry cadence. Thirty-three scenarios took 272 seconds and the
        # thirty-fourth was still going when the budget ran out.
        #
        # Measured: 648 s for all 41 on a fast developer machine; a runner is
        # roughly 1.5-2x slower, so about 16 minutes. Thirty is comfortably
        # clear of that without being so loose that a wedged suite sits there.
        #
        # This is still an outer bound and not a target: every scenario carries
        # its own budget and bails with its last observed state, so a genuine
        # hang is reported by the scenario rather than by this timeout.
        timeout-minutes: 30
        run: ./scripts/run-scenarios.sh

      # Conditioned on the *suite* failing, not on the job failing. A job that
      # fell over during setup has no diagnostics to upload and never claimed
      # to; `if-no-files-found: error` would then add a second, misleading
      # failure on top of the real one. When the suite itself fails the dump is
      # mandatory, which is what that setting is for.
      - name: Upload observable-state diagnostics
        if: failure() && steps.suite.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rhizo-e2e-failure
          path: deploy/artifacts/
          if-no-files-found: error

      # The script tears the topology down itself, on success and on failure
      # alike. This is the belt-and-braces case: a cancelled job, or a failure
      # before the script was reached.
      - name: Tear down
        if: always()
        run: >-
          docker compose
          -f deploy/docker-compose.yml
          -f deploy/docker-compose.test.yml
          down --volumes --remove-orphans
